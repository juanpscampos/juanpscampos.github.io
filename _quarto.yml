project:
  type: website
  output-dir: .
  render:
    - "*.qmd"
    - "!contact.qmd"       # unpublished: contact details live in the footer
    # Resources section is hidden while in progress. The negation is explicit
    # because the website project type otherwise auto-discovers nested .qmd.
    # To unhide: swap the next line back to "resources/*.qmd" and uncomment
    # the navbar entry and sidebar block below.
    - "!resources/*.qmd"

website:
  title: "Juan Pablo Siachoque Campos"
  description: "PhD candidate in Economics at the University of Nottingham. Research on informal employment, labour markets and macroeconomics."
  site-url: "https://juanpscampos.github.io"
  favicon: files/Fotos/Foto_Juan_Siachoque_compress.jpg
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: cv.qmd
        text: CV
      - href: research.qmd
        text: Research
      # - href: resources/index.qmd
      #   text: Resources
  # Scoped by id: this sidebar appears only on resources/ pages, so Home,
  # Research and CV stay sidebar-free. Commented out with the section.
  # sidebar:
  #   - id: resources
  #     title: "Resources"
  #     style: docked
  #     contents:
  #       - resources/index.qmd
  #       - section: "Applied Econometrics"
  #         contents:
  #           - resources/apc.qmd
  open-graph: true
  twitter-card:
    creator: "@juanpscampos"
    card-style: summary
  page-footer:
    left: "&copy; 2026 Juan Pablo Siachoque Campos"
    right:
      - text: "Email"
        href: "mailto:lexjs19@nottingham.ac.uk"
      - text: "LinkedIn"
        href: "https://www.linkedin.com/in/juanpscampos/"
      - text: "X"
        href: "https://x.com/juanpscampos"

format:
  html:
    theme: [cosmo, theme.scss]
    # The single width knob for the whole site. Body text fills this
    # column (see the "Reading width" note in theme.scss), so raising it
    # widens every page and narrows the outer gutters together.
    # Quarto's default is 800px.
    grid:
      body-width: 900px
    toc: true
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: true
